[package]
name = "akita-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "asm",
  "solinas",
] }
akita-serialization = { path = "../crates/akita-serialization" }
akita-error = { path = "../crates/akita-error" }
jolt-sumcheck = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "transcript-blake2b",
] }
libfuzzer-sys = "0.4.12"

[[bin]]
name = "serialization_vec"
path = "fuzz_targets/serialization_vec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sumcheck_rounds"
path = "fuzz_targets/sumcheck_rounds.rs"
test = false
doc = false
bench = false
