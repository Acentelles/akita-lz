[package]
name = "akita-labinius-prover"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Opt-in LaBinius root reduction prover for Akita"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-error = { version = "0.1.0", path = "../akita-error" }
akita-sumcheck = { version = "0.1.0", path = "../akita-sumcheck", default-features = false }
rayon = { version = "1.10", optional = true }
tracing = "0.1"
akita-challenges = { version = "0.1.0", path = "../akita-challenges", default-features = false }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
akita-labinius-verifier = { version = "0.1.0", path = "../akita-labinius-verifier", default-features = false }
jolt-algebra = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "asm",
  "solinas",
] }

jolt-poly = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false }
jolt-sumcheck = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false }
jolt-transcript = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "transcript-blake2b",
] }

[dev-dependencies]
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "lattice",
] }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false }
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "limb_commit_kernel"
harness = false
required-features = ["labinius"]

[[bench]]
name = "fold_kernel"
harness = false
required-features = ["labinius"]

[[bench]]
name = "response_weights"
harness = false
required-features = ["labinius"]

[[bench]]
name = "combined_kernel"
harness = false
required-features = ["labinius"]

[features]
parallel = [
  "dep:rayon",
  "akita-algebra/parallel",
  "akita-labinius-verifier/parallel",
  "jolt-algebra/parallel",
]
labinius = [
  "akita-algebra/labinius-binary",
  "akita-algebra/labinius-trinomial",
  "akita-challenges/labinius-challenges",
  "akita-params/labinius-sis",
  "akita-labinius-verifier/labinius",
]
# Run the tests on Keccak instead of Blake2b; the protocol is generic over
# the sponge.
keccak-test-sponge = [
  "jolt-transcript/transcript-keccak",
  "akita-labinius-verifier/keccak-test-sponge",
]

[lints]
workspace = true
