[package]
name = "akita-challenges"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Compatibility re-export of jolt-crypto's sparse challenges for jolt-akita"
repository = "https://github.com/LayerZero-Labs/akita"
readme = "../../README.md"

[dependencies]
jolt-crypto = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "f15e9b17ccb933d3a0ad49be049cca999256e1e3", default-features = false, features = [
  "lattice",
] }

[features]
parallel = ["jolt-crypto/parallel"]

[lints]
workspace = true
